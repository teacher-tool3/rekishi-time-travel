<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>歴史タイムトラベル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 絵巻をめくって時をさかのぼる旅。落ち着いた和の色で、子どもも大人も
   IDEA: 真鍮のタイムマシンと、和紙の札・巻物・すごろく盤
   PICTURE: 時代の風景の上に置かれたすごろく盤
   COLOUR and TYPE: 生成り・墨・藍・抹茶・えんじ・金茶 / Shippori Mincho B1 + Zen Maru Gothic
   LAYOUT: iPad横置き中心。上に帯、下にタブ、中央に盤や問題 */
:root{color-scheme:light;--washi:#f3ecdf;--washi2:#e7dcc7;--sumi:#2d2a26;--sumi2:#5b544a;--usu:#8b8478;--ai:#3e5b74;--aid:#24364a;--night:#1b212c;--matcha:#7d8c55;--enji:#8c3d45;--kin:#b08a4f;--kin2:#d9c391;--teal:#5f7f80;--ok:#5f7f4a;--ng:#9a4a4a;--mincho:"Shippori Mincho B1","Hiragino Mincho ProN",serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--washi);color:var(--sumi);font:500 17px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
rt{font-size:.5em;font-weight:500;letter-spacing:0}
body.nofuri rt{display:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.scr{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}
.btn{min-height:48px;padding:8px 22px;border-radius:12px;font-weight:700;font-size:18px;background:var(--washi2);border:1px solid #c9b994;color:var(--sumi)}
.btn.main{background:var(--ai);color:#f3ecdf;border-color:var(--aid);box-shadow:0 3px 0 var(--aid)}
.btn.main:active{transform:translateY(2px);box-shadow:0 1px 0 var(--aid)}
.btn.enji{background:var(--enji);color:#f3ecdf;border-color:#6d2c33;box-shadow:0 3px 0 #6d2c33}
.btn.ghost{background:transparent;border:1px solid rgba(243,236,223,.4);color:#f3ecdf;min-height:44px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.muted{color:var(--usu)}
h1,h2,h3{font-family:var(--mincho);font-weight:800;margin:0;line-height:1.25}
/* ---- 旅人選び ---- */
#sProfile{background:radial-gradient(120% 80% at 50% 0%,#33485c,var(--night));color:#efe6d4;align-items:center;overflow:auto}
.pwrap{width:min(720px,92vw);padding:6vh 0 40px;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{width:min(300px,60vw)}
.ttl{font-size:clamp(40px,7vw,64px);letter-spacing:.08em;text-align:center;color:#efe2c4;text-shadow:0 2px 0 #10151d}
.ttl small{display:block;font-size:.32em;letter-spacing:.3em;color:var(--kin2);margin-top:8px}
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;padding:14px 18px;border-radius:14px;background:linear-gradient(#efe4cc,#dccaa4);color:var(--sumi);border:1px solid #b49b6e;box-shadow:0 4px 0 #8f7a56;text-align:left;min-height:72px}
.pbtn .pn{font-family:var(--mincho);font-size:22px;font-weight:800}
.pbtn .pm{font-size:13px;color:var(--sumi2)}
.pnew{display:flex;gap:10px;width:100%;flex-wrap:wrap}
.pnew input{flex:1;min-width:180px;min-height:52px;border-radius:12px;border:1px solid #b49b6e;background:#f3ecdf;padding:0 16px;font:inherit;font-size:18px}
.thold{margin-top:14px;font-size:14px;color:#9fa9b5;border:1px dashed #56657a;border-radius:10px;padding:10px 16px;min-height:44px;position:relative;overflow:hidden}
.thold i{position:absolute;left:0;bottom:0;height:3px;background:var(--kin);width:0}
.thold.hold i{width:100%;transition:width 1.3s linear}
/* ---- ホーム ---- */
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--aid);color:#efe6d4;flex-wrap:wrap}
.top h1{font-size:22px;letter-spacing:.06em;color:#efe2c4;margin-right:auto}
.top .tg{font-size:14px;padding:6px 12px;min-height:40px;border-radius:10px;border:1px solid rgba(239,230,212,.3)}
.top .tg.off{opacity:.5;text-decoration:line-through}
#pane{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#26303c;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{color:#b9c0c8;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;border-radius:10px}
.tabs button b{font-family:var(--mincho);font-size:20px;line-height:1}
.tabs button.on{background:#3a4757;color:#f0e2c2}
.travel{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:28px;padding:24px 28px;align-items:start}
@media(max-width:820px){.travel{grid-template-columns:1fr}.dialbox{max-width:420px;margin:0 auto}}
.dialbox{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:0}
.dial{width:100%;max-width:380px;filter:drop-shadow(0 10px 18px rgba(30,30,40,.25))}
.dial .dg{font-family:var(--mincho);font-size:22px;fill:#efe6d4;font-weight:800}
.dial .dc{font-family:var(--mincho);font-size:30px;fill:#26384a;font-weight:800}
.g1{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
.g2{animation:spin 24s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.needle{animation:sway 6s ease-in-out infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{50%{transform:rotate(30deg)}}
.who{text-align:center}.who b{font-family:var(--mincho);font-size:26px;display:block}.who span{color:var(--enji);font-weight:700}
.lead{margin:4px 0;color:var(--sumi2);text-align:center}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.door{position:relative;aspect-ratio:3/4.6;border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#f3ecdf;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.25),inset 0 0 0 3px rgba(243,236,223,.18);transition:transform .15s}
.door:active{transform:scale(.97)}
.door::before{content:"";position:absolute;inset:8px;border:1px solid rgba(243,236,223,.35);border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(243,236,223,.06) 24px 25px)}
.door .dn{writing-mode:vertical-rl;font-family:var(--mincho);font-weight:800;font-size:22px;letter-spacing:.12em;position:relative;flex:1;display:flex;align-items:center}
.door .dy{position:relative;font-size:12px;opacity:.85}.door.long .dn{font-size:18px;letter-spacing:.04em}
.door .pips{position:relative;display:flex;gap:3px;margin-top:4px}
.door .pips i{width:7px;height:7px;border-radius:50%;background:rgba(243,236,223,.25)}
.door .pips i.f{background:var(--kin2)}
.door.lock{filter:grayscale(.85) brightness(.75)}
.door .lk{position:relative;font-size:12px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:20px}
.door.clr::after{content:"済";position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--enji);font-family:var(--mincho);display:grid;place-items:center;font-size:16px;border:2px solid #f3ecdf}
.door.tatsu{background:linear-gradient(160deg,#3a3125,#14110d)!important;color:var(--kin2)}
/* ---- 盤 ---- */
#sBoard{background:#e9dfc9}
.bhead{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(36,54,74,.95);color:#efe6d4;flex-wrap:wrap}
.bhead h2{font-size:24px;letter-spacing:.06em;margin-right:auto}
.bhead .bp{font-size:15px;color:var(--kin2)}
.bwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(#e4d6bb,#cdbf98)}
#board{width:100%;height:100%;display:block}
.sq{cursor:pointer}
.sq .pulse{fill:none;stroke:#f3ecdf;stroke-width:4;opacity:0}
.sq.cur .pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
.sq .sqg{font-family:var(--mincho);font-weight:800;font-size:30px;fill:var(--sumi)}
.sq.lk{opacity:.55}
.sq .num{font-size:15px;font-weight:700;fill:#f3ecdf}
.trav{transition:transform 1s cubic-bezier(.5,0,.3,1)}
.bhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(36,54,74,.88);color:#efe6d4;padding:8px 18px;border-radius:30px;font-size:15px;white-space:nowrap}
/* ---- ワープ ---- */
#sWarp{background:#181e2a;align-items:center;justify-content:center}
#wcv{position:absolute;inset:0;width:100%;height:100%}
.wy{position:relative;font-family:var(--mincho);font-weight:800;font-size:clamp(48px,10vw,110px);color:#efe2c4;text-shadow:0 0 30px rgba(217,195,145,.6);font-variant-numeric:tabular-nums}
.wm{position:relative;font-family:var(--mincho);font-size:clamp(26px,4vw,40px);color:var(--kin2);min-height:1.6em;margin-top:8px}
#wFlash{position:absolute;inset:0;background:#f3ecdf;opacity:0;pointer-events:none;transition:opacity .5s}
#wFlash.on{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
/* ---- 問題 ---- */
#sQuiz{background:#d8ccb2}
.qbg{position:absolute;inset:0;opacity:.45;filter:blur(2px) saturate(.8)}
.qbg svg{width:100%;height:100%}
#sQuiz.boss{background:#14161d}#sQuiz.boss .qbg{opacity:.18;filter:blur(3px) grayscale(.5)}
#sQuiz.tatsu{background:radial-gradient(circle at 50% 30%,#3a3125,#100e0b)}#sQuiz.tatsu .qbg{display:none}
.qtop{position:relative;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(36,54,74,.92);color:#efe6d4}
.boss .qtop,.tatsu .qtop{background:rgba(10,10,12,.7)}
.qtitle{font-family:var(--mincho);font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brush{flex:1;height:14px;background:rgba(243,236,223,.15);border-radius:10px;overflow:hidden}
.brush i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a868,var(--kin2));border-radius:10px;transition:width .6s cubic-bezier(.3,0,.2,1)}
.qcount{font-size:15px;white-space:nowrap}
.qmain{position:relative;flex:1;display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;padding:16px 22px 8px;overflow:auto}
@media(max-width:820px){.qmain{grid-template-columns:1fr}.qnpc{flex-direction:row!important;align-items:center}.qnpc .pt{width:72px!important}}
.qnpc{display:flex;flex-direction:column;align-items:center;gap:8px}
.qnpc .pt{width:170px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.qnpc .nm{font-weight:700;font-size:15px;color:var(--sumi2)}
.boss .qnpc .nm,.tatsu .qnpc .nm{color:var(--kin2)}
.bub{background:#f3ecdf;border-radius:14px;padding:10px 14px;font-size:15px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.15);max-width:220px}
.boss .bub{background:#2a2226;color:#f0dcc8;border:1px solid #6d2c33}
.tatsu .bub{background:#2b251c;color:var(--kin2);border:1px solid #6b5630}
.qcol{display:flex;flex-direction:column;gap:14px;max-width:880px;width:100%;margin:0 auto}
.paper{position:relative;background:linear-gradient(#f6f0e4,#efe6d4);border-radius:6px;padding:20px 28px 22px;box-shadow:0 8px 20px rgba(40,30,20,.18);border-left:14px solid #8c6f45;border-right:14px solid #8c6f45}
.paper.unroll{animation:unroll .55s cubic-bezier(.3,0,.2,1)}
@keyframes unroll{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
.boss .paper{background:linear-gradient(#efe2d0,#e1cfb6);border-color:#6d2c33}
.tatsu .paper{border-color:#3a2f1e;background:linear-gradient(#f4ead2,#e6d6b0)}
.qno{font-family:var(--mincho);font-weight:800;color:var(--enji);font-size:16px}
.qtext{font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.75;margin-top:2px}
.photo{margin:10px auto 0;width:min(360px,80%);text-align:center}.photo img{width:100%;max-height:34vh;object-fit:contain;display:block;border-radius:10px;background:#e4e2db;box-shadow:0 4px 12px rgba(0,0,0,.15)}.photo figcaption{font-size:14px;line-height:1.6;color:var(--sumi2);margin-top:6px}.photo small{font-size:12px;color:var(--usu)}.expph .photo{float:right;width:min(200px,40%);margin:0 0 8px 16px}.cred{font-size:14px!important;color:var(--sumi2);margin:4px 0!important}.modal .photo{width:min(300px,80%)}
.qfig .pic{width:min(240px,60%);margin:10px auto 0}
.qfig svg,.pic svg{width:100%;display:block}
.stampbox{position:absolute;right:16px;top:8px;width:110px;pointer-events:none}
.stampbox svg{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.2) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:.92}}
.qans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qans.one{grid-template-columns:1fr}
.fuda{position:relative;min-height:72px;padding:12px 18px 12px 30px;border-radius:10px;background:linear-gradient(#efe1c2,#dfc9a0);border:1px solid #b49b6e;box-shadow:0 4px 0 #9c8460;font-size:clamp(17px,2vw,21px);font-weight:700;text-align:left;line-height:1.6;transition:transform .12s,opacity .3s,background .3s}
.fuda::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:#a68c62;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.fuda:active{transform:translateY(3px);box-shadow:0 1px 0 #9c8460}
.fuda.ok{background:linear-gradient(#dfe6cc,#c6d3a8);border-color:var(--ok);box-shadow:0 4px 0 #4d6a3c}
.fuda.ng{background:linear-gradient(#ead2cc,#d9b5ac);border-color:var(--ng);box-shadow:0 4px 0 #7d3a3a}
.fuda.gone{opacity:.25;pointer-events:none}
.fuda.dim{opacity:.55}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tfb{min-height:120px;font-size:64px;font-family:var(--mincho);text-align:center;padding:0}
.tfb::before{display:none}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.oi{touch-action:none;display:flex;align-items:center;gap:12px;cursor:grab;padding-left:20px}
.oi::before{display:none}
.oi .grip{flex:none;width:22px;height:26px;background:radial-gradient(circle,#8c7552 2px,transparent 2.5px) 0 0/8px 8px;opacity:.8}
.oi .on{flex:none;font-family:var(--mincho);color:var(--enji);font-size:18px}
.oi.drag{z-index:5;box-shadow:0 10px 20px rgba(0,0,0,.25);background:linear-gradient(#f6ebd2,#e8d6b0);transition:none}
.inst{margin:0;color:var(--sumi2);font-size:15px}
.boss .inst,.tatsu .inst{color:#d8c9b0}
.pairs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 64px}
.pairs svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pc{display:flex;flex-direction:column;gap:12px}
.pc .fuda{min-height:64px}
.fuda.sel{outline:4px solid var(--kin);outline-offset:2px}
.mapq{background:#c9d3cf;border-radius:12px;padding:6px;box-shadow:inset 0 0 0 2px #a9b6b2}
.mapq svg{width:100%;max-height:52vh;display:block}
.pin{cursor:pointer}.pin text{font-size:15px;font-weight:700;fill:#f3ecdf;font-family:"Zen Maru Gothic",sans-serif}
.pin.dim{opacity:.35}
.exp{background:#f6f0e4;border-radius:12px;padding:16px 22px;box-shadow:0 6px 16px rgba(40,30,20,.18);border-top:6px solid var(--usu);animation:rise .35s ease-out}
.exp.ok{border-top-color:var(--ok)}.exp.ng{border-top-color:var(--enji)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.exph{font-family:var(--mincho);font-weight:800;font-size:24px}
.exp.ok .exph{color:var(--ok)}.exp.ng .exph{color:var(--enji)}
.expa{margin:6px 0;font-weight:700;font-size:18px}
.expa span{display:inline-block;background:var(--sumi);color:#f3ecdf;font-size:13px;padding:1px 10px;border-radius:20px;margin-right:8px;vertical-align:middle}
.exp p{margin:6px 0 12px;font-size:17px;line-height:1.85}
.exp ol{margin:6px 0;padding-left:1.4em;font-weight:700}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.tl b{background:var(--washi2);border-radius:8px;padding:4px 10px;font-size:15px}
.tl i{color:var(--usu);font-style:normal}
.hints{position:relative;display:flex;align-items:center;gap:10px;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(36,54,74,.9);color:#efe6d4;overflow-x:auto}
.boss .hints,.tatsu .hints{background:rgba(10,10,12,.7)}
.hints .hl{font-size:14px;white-space:nowrap}
.hc{flex:none;width:58px;height:58px;border-radius:50%;background:#efe6d4;padding:2px;border:3px solid #8f7a56;position:relative}
.hc .pt{width:100%;height:100%}
.hc.rel{border-color:var(--kin2);box-shadow:0 0 0 3px rgba(217,195,145,.5),0 0 18px rgba(217,195,145,.9);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(217,195,145,.2),0 0 26px rgba(217,195,145,.9)}}
.hc.used{opacity:.4}
/* ---- モーダル ---- */
.modal{position:fixed;inset:0;background:rgba(20,22,28,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;opacity:0;transition:opacity .25s}
.modal.on{opacity:1}
.sheet{background:var(--washi);border-radius:18px;padding:24px 26px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);transform:translateY(16px);transition:transform .3s}
.modal.on .sheet{transform:none}
.modal.dark{background:rgba(5,5,8,.82)}
.modal.dark .sheet{background:#1d1a1c;color:#f0dcc8;border:1px solid #6d2c33}
.modal.wide .sheet{width:min(820px,100%)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.talk{display:flex;gap:18px;align-items:flex-end}
.talk .pt{width:130px;flex:none}
.talk .tb{flex:1}
.talk .tn{font-weight:700;color:var(--enji);font-size:15px}
.modal.dark .talk .tn{color:var(--kin2)}
.talk .tt{font-size:20px;line-height:1.9;min-height:3.8em;font-weight:700}
.talk .sqh{font-family:var(--mincho);font-size:15px;color:var(--usu)}
@media(max-width:560px){.talk{flex-direction:column;align-items:center}.talk .pt{width:96px}}
.res{text-align:center}
.res h2{font-size:30px;color:var(--ai)}
.res.win h2{color:var(--enji)}
.res .big{font-family:var(--mincho);font-size:72px;font-weight:800;line-height:1.1}
.res .big small{font-size:.4em;color:var(--usu)}
.gains{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.gains span{background:var(--washi2);border-radius:20px;padding:4px 14px;font-size:15px}
.rank{display:inline-block;font-family:var(--mincho);font-weight:800;font-size:22px;padding:2px 16px;border:2px solid currentColor;border-radius:8px;margin:6px 0}
/* ---- カード ---- */
.card{width:180px;aspect-ratio:5/7.2;border-radius:12px;padding:7px;background:#8a7458;box-shadow:0 6px 14px rgba(0,0,0,.25);position:relative}
.card.r2{background:linear-gradient(135deg,#9aa1a5,#6f777c)}
.card.r3{background:linear-gradient(135deg,#9c4b52,#6d2c33)}
.card.gold{background:linear-gradient(135deg,#e2cc96,#9a7843,#e2cc96)}
.card .cin{height:100%;border-radius:7px;background:linear-gradient(#f6efe1,#e9dcc2);display:flex;flex-direction:column;align-items:center;padding:8px 6px;text-align:center;overflow:hidden;position:relative}
.card .cimg{width:78%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid rgba(0,0,0,.12)}

<script>
{
/* ================= 基本 ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const R=s=>String(s).replace(/([一-鿿々〆ヶ]+)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const P=s=>String(s).replace(/\{[^}]+\}/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY='rekishi-tt-v1';
let D={profiles:[],cur:-1,set:{bgm:true,se:true,furi:true}};
try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);D=Object.assign(D,o);D.set=Object.assign({bgm:true,se:true,furi:true},o.set||{})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
let me=null;
const blank=n=>({name:n,pos:{},cleared:{},cards:{},placed:{},words:{},sites:{},nigate:[],st:{ans:0,ok:0},titles:{},ctitle:'',flags:{},news:{},rep:0,mapok:0,tok:0,tatsu:false,all:false,seen:{}});
const fix=p=>{const b=blank(p.name);for(const k in b)if(p[k]===undefined)p[k]=b[k];return p};
const show=id=>$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));

/* ================= 音 ================= */
const AU={ctx:null,cur:null,want:null,timer:null,drone:null,nb:null};
function ac(){if(!AU.ctx){try{const c=AU.ctx=new(window.AudioContext||window.webkitAudioContext)();AU.m=c.createGain();AU.m.gain.value=.85;AU.m.connect(c.destination);AU.b=c.createGain();AU.b.gain.value=.34;AU.b.connect(AU.m);AU.s=c.createGain();AU.s.gain.value=.7;AU.s.connect(AU.m);
 const d=c.createDelay();d.delayTime.value=.27;const fb=c.createGain();fb.gain.value=.3;const lp=c.createBiquadFilter();lp.frequency.value=1800;AU.b.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(AU.m);
 const n=c.sampleRate*3;AU.nb=c.createBuffer(1,n,c.sampleRate);const x=AU.nb.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1}catch(e){AU.ctx=null}}
 if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx}
function tone(f,t,d,{type='sine',v=.2,a=.01,dest,vib=0,f2}={}){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 if(vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5;lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d+.1)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||AU.s);o.start(t);o.stop(t+d+.05)}
function noise(t,d,{v=.2,f=1000,q=1,type='bandpass',dest}={}){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.nb;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest||AU.s);s.start(t,Math.random()*1.5,d+.05)}
const pluck=(f,t,v,dest)=>{tone(f,t,1.3,{type:'triangle',v,a:.004,dest});tone(f*2,t,.4,{v:v*.35,a:.004,dest})};
const flute=(f,t,d,v,dest)=>{tone(f,t,d,{v,a:.09,vib:5,dest});noise(t,Math.min(d,.25),{v:v*.25,f:f*2,q:3,dest})};
const taiko=(t,v,dest)=>{tone(120,t,.55,{v,a:.004,f2:42,dest});noise(t,.09,{v:v*.35,f:260,dest})};
const wood=(t,v,dest)=>noise(t,.05,{v,f:1700,q:7,dest});
const N=n=>440*2**((n-69)/12);const sc=(root,steps)=>steps.map(x=>N(root+x));
const YO=[0,2,5,7,9,12,14],IN=[0,1,5,7,8,12,13],RYU=[0,2,4,7,9,12,14],MAJ=[0,2,4,5,7,9,11,12,14],MIN=[0,2,3,5,7,8,10,12];
const BG={
 home:{tempo:56,sc:[293.66,311.13,392,440,466.16,587.33],inst:'pluck',drone:146.83,dr:[0,0,0,0,0,0,0,0],dens:.42},
 jomon:{tempo:88,sc:[293.66,329.63,392,440,493.88,587.33],inst:'flute',drone:0,dr:[2,0,1,0,2,1,1,0],dens:.5},
 asuka:{tempo:52,sc:sc(62,YO),inst:'sho',drone:N(50),dr:[0,0,0,0,0,0,0,0],dens:.5},
 nara:{tempo:60,sc:sc(62,RYU),inst:'sho',drone:N(50),dr:[2,0,0,0,0,0,0,0],dens:.45},
 heian:{tempo:66,sc:sc(64,IN),inst:'pluck',drone:0,dr:[0,0,0,0,0,0,0,0],dens:.6},
 kamakura:{tempo:80,sc:sc(57,IN),inst:'flute',drone:N(45),dr:[2,0,0,1,2,0,0,0],dens:.4},
 muromachi:{tempo:54,sc:sc(62,IN),inst:'flute',drone:0,dr:[1,0,0,0,0,0,0,0],dens:.3},
 sengoku:{tempo:112,sc:sc(50,MIN),inst:'hora',drone:N(38),dr:[2,0,2,1,2,0,2,1],dens:.35},
 edo:{tempo:120,sc:sc(64,YO),inst:'shami',drone:0,dr:[1,0,0,1,0,0,1,0],dens:.65},
 meiji:{tempo:116,sc:sc(60,MAJ),inst:'march',drone:0,dr:[2,0,3,0,2,0,3,3],dens:.7},
 showa:{tempo:72,sc:sc(57,MIN),inst:'piano',drone:0,dr:[0,0,0,0,0,0,0,0],dens:.55},
 gendai:{tempo:96,sc:sc(60,MAJ),inst:'piano',drone:0,dr:[0,0,3,0,0,0,3,0],dens:.6},
 boss:{tempo:74,sc:[146.83,155.56,196,220,233.08,293.66],inst:'flute',drone:73.42,dr:[2,0,0,2,0,0,2,1],dens:.33},
 tatsu:{tempo:62,sc:[293.66,311.13,392,440,466.16,587.33,622.25],inst:'pluck',drone:146.83,dr:[0,0,0,0,1,0,0,0],dens:.55}};
const snare=(t,v,dest)=>noise(t,.12,{v,f:2600,q:.8,type:'highpass',dest});
function bgm(name){AU.want=name;if(AU.cur===name)return;stopBgm();AU.cur=null;if(!name||!D.set.bgm||!ac())return;const cfg=BG[name];if(!cfg)return;AU.cur=name;
 const c=AU.ctx,dest=AU.b,sd=60/cfg.tempo/2;let t=c.currentTime+.15,step=0,idx=2,hold=0;
 if(cfg.drone){const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=cfg.drone;lp.frequency.value=300;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+2);o.connect(lp);lp.connect(g);g.connect(dest);o.start(t);AU.drone={o,g}}
 AU.timer=setInterval(()=>{while(t<c.currentTime+.3){const d=cfg.dr[step%8];if(d===2)taiko(t,.42,dest);else if(d===1)wood(t,.16,dest);else if(d===3)snare(t,.12,dest);
  if(hold>0)hold--;else if(Math.random()<cfg.dens){idx=Math.max(0,Math.min(cfg.sc.length-1,idx+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));const f=cfg.sc[idx],I=cfg.inst;
   if(I==='pluck'){pluck(f,t,.12,dest);if(step%16===0)pluck(f/2,t,.08,dest)}
   else if(I==='sho'){if(step%4===0){const len=4*sd*1.6;[0,7,12].forEach((x,k)=>tone(f*2**(x/12),t,len,{v:.035-k*.008,a:.5,dest}));hold=3}}
   else if(I==='shami'){tone(f,t,.35,{type:'square',v:.03,a:.003,dest});tone(f*2,t,.18,{type:'triangle',v:.05,a:.003,dest})}
   else if(I==='march'){tone(f,t,sd*.9,{type:'square',v:.03,a:.005,dest});if(step%4===0)tone(f/2,t,sd*1.8,{type:'triangle',v:.06,dest})}
   else if(I==='piano'){tone(f,t,1.6,{type:'triangle',v:.1,a:.004,dest});tone(f*2,t,.8,{v:.03,a:.004,dest});if(step%8===0)[0,4,7].forEach(x=>tone(f/2*2**(x/12),t,2,{type:'triangle',v:.04,a:.01,dest}))}
   else if(I==='hora'){const len=[2,3,4][Math.random()*3|0];tone(f,t,len*sd*1.1,{type:'sawtooth',v:.035,a:.12,vib:3,dest});hold=len-1}

  for(const id of cards)await cardGet(id);checkTitles();if(v==='retry')startTatsu();else enterHome('travel')}}
async function cardGet(id){sfx('get');const c=CARDS[id];await modal(`<div class="cget"><div class="rays"></div>${cardHtml(id)}<h2>${R(c.name)}${R(c.gold?'の金札{きんふだ}を手{て}に入{い}れた！':'が仲間{なかま}になった！')}</h2><p style="position:relative;font-weight:700">「${R(c.line)}」</p><p class="muted" style="position:relative;font-size:14px">${R('問題{もんだい}でヒントをくれるよ。カードの「絵巻{えまき}」にもはってみよう。')}</p><div class="row"><button class="btn main" data-v="1">${R('やったね')}</button></div></div>`)}
function startRepair(){if(!me.nigate.length){toast(R('にがて問題{もんだい}はないよ'));return}startQuiz({mode:'repair',list:shuf(me.nigate.filter(id=>QB[id])).slice(0,5).map(id=>QB[id])})}
async function startTatsu(){sfx('gong');const v=await talk('elder',NPC.okina.n,['よくぞ来{き}た、旅人{たびびと}よ。ここは達人{たつじん}の間{ま}じゃ。','中学校{ちゅうがっこう}で学{まな}ぶような、むずかしい問題{もんだい}も出{で}るぞ。','正解{せいかい}を積{つ}み重{かさ}ねれば段位{だんい}が上{あ}がり、全問{ぜんもん}正解{せいかい}なら金{きん}の札{ふだ}がもらえる。'],'挑戦{ちょうせん}する','dark','達人{たつじん}の間{ま}');if(v!=='1')return;startQuiz({mode:'tatsu',list:shuf(POOL.T).slice(0,5)})}
async function maybeBroke(){if(me.nigate.length>=3&&Math.random()<.4){await sleep(500);sfx('broke');const v=await modal(`<div class="res"><h2>${R('ガガガ…タイムマシンが故障{こしょう}した！')}</h2><p style="font-size:18px;line-height:1.9">${R(`まちがえた問題{もんだい}が${me.nigate.length}こ、部品{ぶひん}をこわしているみたい。にがて問題{もんだい}を解{と}いて修理{しゅうり}しよう！`)}</p><div class="row"><button class="btn" data-v="0">${R('あとで')}</button><button class="btn main" data-v="1">${R('修理{しゅうり}する')}</button></div></div>`);if(v==='1')startRepair()}}


const TNAME={c:'4択',tf:'○×',pic:'写真',map:'地図',order:'ならべかえ',pair:'線つなぎ'};
function paneDebug(){const all=Object.values(QB),cnt={};all.forEach(q=>cnt[q.t]=(cnt[q.t]||0)+1);
 return `<div class="panehead"><h2>${R('確認{かくにん}（先生用{せんせいよう}）')}</h2><p>${R('すべての問題{もんだい}・答{こた}え・演出{えんしゅつ}をここから確{たし}かめられます。先生{せんせい}の記録{きろく}は子{こ}どもの成績{せいせき}には入{はい}りません。')}</p></div>
 <div class="sec"><h3>${R('演出{えんしゅつ}を見{み}る')}</h3><div class="row" style="justify-content:flex-start;margin-top:0">
  <button class="btn" data-dbg="warp">タイムスリップ</button><button class="btn" data-dbg="boss">ボス戦</button><button class="btn" data-dbg="tatsu">達人の間</button><button class="btn" data-dbg="broke">故障イベント</button><button class="btn" data-dbg="card">カード獲得</button><button class="btn" data-dbg="news">時代新聞</button><button class="btn" data-dbg="title">称号の通知</button></div></div>
 <div class="sec"><h3>${R('音{おと}を聞{き}く')}</h3><div class="row" style="justify-content:flex-start;margin-top:0">${Object.keys(BG).map(k=>`<button class="btn" data-bgm="${k}">BGM：${{home:'タイムマシン',jomon:'縄文・弥生',boss:'ボス戦',tatsu:'達人の間'}[k]}</button>`).join('')}<button class="btn" data-bgm="">BGMを止める</button></div>
  <div class="row" style="justify-content:flex-start">${Object.keys(SFX).map(k=>`<button class="btn" data-se="${k}" style="min-height:40px;font-size:15px">${k}</button>`).join('')}</div></div>
 <div class="sec"><h3>${R('マスを直接{ちょくせつ}プレイ')}</h3>${ERAS.map((e,ei)=>SQ[e.id]?`<p style="margin:10px 0 4px;font-weight:700">${R(e.name)}</p><div class="row" style="justify-content:flex-start;margin-top:0">${SQ[e.id].map((q,i)=>`<button class="btn" data-sq="${ei}:${i}" style="min-height:40px;font-size:15px">${R(`${i+1}. ${q.name}`)}</button>`).join('')}</div>`:'').join('')}</div>
 <div class="sec"><h3>${R(`問題{もんだい}一覧{いちらん}（全{ぜん}${all.length}問{もん}）`)}</h3><p class="muted" style="margin-top:0">${Object.entries(cnt).map(([k,v])=>`${TNAME[k]} ${v}問`).join('　')}</p>
 ${Object.keys(POOL).map(k=>`<details style="margin:8px 0;background:#f6f0e4;border-radius:12px;padding:10px 14px"><summary style="font-weight:700;font-size:18px;cursor:pointer;min-height:36px">${POOLNAME[k]}（${POOL[k].length}問）</summary>
  <table class="stack" style="margin-top:8px"><thead><tr><th>形式</th><th>問題</th><th>答え</th><th>関係</th><th></th></tr></thead><tbody>${POOL[k].map(q=>`<tr><td>${TNAME[q.t]}</td><td>${R(q.q)}${q.pic&&PHOTO[q.pic]?`<br><img src="img/${q.pic}.jpg" style="height:60px;border-radius:6px;margin-top:4px">`:''}${(()=>{const a=figPre(q),b=figPost(q),k=a||b;return k&&q.t!=='pic'?`<br><img src="img/${k}.jpg" style="height:48px;border-radius:6px;margin-top:4px;${a?'':'opacity:.55'}"><span class="muted" style="font-size:12px"> ${a?'問題で表示':'解説で表示'}</span>`:''})()}</td><td><b>${ansText(q)}</b><div class="muted" style="font-size:13px">${R(q.e)}</div></td><td style="font-size:13px">${q.p?R(CARDS[q.p].name):''}${q.w?'<br>'+q.w.map(w=>R(WORDS[w][0])).join('、'):''}</td><td><button class="btn" data-q="${q.id}" style="min-height:40px;font-size:15px;white-space:nowrap">解く</button></td></tr>`).join('')}</tbody></table></details>`).join('')}</div>
 <div class="sec"><h3>${R('先生{せんせい}の記録{きろく}をリセット')}</h3><button class="btn enji" id="dbgReset">先生用の記録をはじめにもどす</button></div>`}
function bindDebug(){
 $$('[data-q]').forEach(b=>b.onclick=()=>{sfx('tap');startQuiz({mode:'debug',era:0,list:[QB[b.dataset.q]]})});
 $$('[data-sq]').forEach(b=>b.onclick=()=>{sfx('tap');const[x,y]=b.dataset.sq.split(':');B=+x;sqTap(+y)});
 $$('[data-bgm]').forEach(b=>b.onclick=()=>{ac();const k=b.dataset.bgm;if(!k){stopBgm();AU.cur=null}else{const o=D.set.bgm;D.set.bgm=true;AU.cur=null;bgm(k);D.set.bgm=o}});
 $$('[data-se]').forEach(b=>b.onclick=()=>{ac();const o=D.set.se;D.set.se=true;sfx(b.dataset.se);D.set.se=o});
 $$('[data-dbg]').forEach(b=>b.onclick=async()=>{const k=b.dataset.dbg;ac();
  if(k==='warp')warp(0);else if(k==='boss'){B=0;startQuiz({mode:'boss',era:0,sq:7,list:shuf(POOL.H).slice(0,5)})}else if(k==='tatsu')startTatsu();
  else if(k==='broke'){const n=me.nigate;me.nigate=['a1','a2','a3'];const r=Math.random;Math.random=()=>0;await maybeBroke();Math.random=r;if(Q&&Q.mode==='repair')return;me.nigate=n}
  else if(k==='card')cardGet('himiko');else if(k==='news')showNews('jomon');else if(k==='title'){sfx('star');toast(R('称号{しょうごう}「縄文{じょうもん}・弥生{やよい}マスター」を手{て}に入{い}れた！'),3200)}});
 const r=$('#dbgReset');if(r)r.onclick=()=>{if(!r.dataset.c){r.dataset.c=1;r.textContent='本当にもどす？もう一度押す';return}D.teacher=null;save();sfx('broke');toast('先生用の記録をもどしました');renderProfiles()}}
/* ================= 先生モード ================= */
let tSel=-1;
function openTeacher(){show('sTeacher');$('#tBack').innerHTML='◀ もどる';renderTeacher()}
$('#tBack').onclick=()=>{sfx('tap');renderProfiles()};
function renderTeacher(){const ps=D.profiles;$('#tBody').innerHTML=`<p class="muted">${R('子{こ}どもごとの記録{きろく}です。名前{なまえ}をタップすると、にがて問題{もんだい}や設定{せってい}を見{み}られます。')}</p>
 ${ps.length?`<table class="stack"><thead><tr><th>名前</th><th>クリア</th><th>正解/回答</th><th>正答率</th><th>カード</th><th>ことば</th><th>にがて</th><th>達人</th></tr></thead><tbody>${ps.map((p,i)=>{fix(p);const r=p.st.ans?Math.round(p.st.ok/p.st.ans*100):0;return `<tr data-i="${i}" style="cursor:pointer;${i===tSel?'background:#efe2c4':''}"><td><b>${esc(p.name)}</b></td><td class="n">${clearedN(p)}</td><td class="n">${p.st.ok}/${p.st.ans}</td><td class="n">${r}%</td><td class="n">${Object.keys(p.cards).length}</td><td class="n">${Object.keys(p.words).length}</td><td class="n">${p.nigate.length}</td><td>${P(dan(p.tok))}</td></tr>`}).join('')}</tbody></table>`:'<p>まだ旅人がいません。</p>'}
 <div id="tdet"></div><div class="row" style="justify-content:flex-start;margin-top:22px"><button class="btn" id="tPw">パスワードを変更する</button></div>`;
 $('#tPw').onclick=async()=>{const p=await pwModal('新{あたら}しいパスワード','4文字{もじ}以上{いじょう}で2回{かい}入{い}れてください。',true);if(p){D.tpw=hashPw(p);save();toast('パスワードを変更しました')}};
 $$('#tBody tr[data-i]').forEach(tr=>tr.onclick=()=>{tSel=+tr.dataset.i;renderTeacher()});if(tSel>=0&&ps[tSel])renderTDet()}
function renderTDet(){const p=ps(),pp=D.profiles[tSel];function ps(){return D.profiles[tSel]}
 $('#tdet').innerHTML=`<div class="tdet"><h3 style="font-size:22px">${esc(pp.name)}</h3><p style="margin:6px 0">にがて問題（${pp.nigate.length}）</p><ol class="nlist" style="max-height:none">${pp.nigate.map(id=>QB[id]?`<li>${esc(P(QB[id].q))}<br><span style="color:#5f7f4a">答え：${esc(P(QB[id].o?QB[id].o[0]:QB[id].t==='tf'?(QB[id].a?'○':'×'):QB[id].t==='map'?SITES[QB[id].s[0]].n:'（並べかえ・線つなぎ）'))}</span></li>`:'').join('')||'<li>なし</li>'}</ol>
 <div class="row"><button class="btn" id="tAll">${pp.all?'時代の開放をもとにもどす':'すべての時代をひらく'}</button><button class="btn" id="tTat">${pp.tatsu?'達人の間をとじる':'達人の間をひらく'}</button><button class="btn enji" id="tDel">記録を消す</button></div></div>`;
 $('#tAll').onclick=()=>{pp.all=!pp.all;save();sfx('tap');renderTeacher()};$('#tTat').onclick=()=>{pp.tatsu=!pp.tatsu;save();sfx('tap');renderTeacher()};
 $('#tDel').onclick=e=>{const b=e.currentTarget;if(b.dataset.c){D.profiles.splice(tSel,1);tSel=-1;D.cur=-1;save();sfx('broke');renderTeacher()}else{b.dataset.c=1;b.textContent='本当に消す？もう一度押す'}}}

/* ================= 起動 ================= */
document.body.classList.toggle('nofuri',!D.set.furi);
renderProfiles();
}
</script></body></html>
